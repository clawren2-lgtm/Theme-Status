<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" sizes="512x512" type="image/png" href="https://www.highpoint.edu/wp-content/themes/hpu/assets/frontend/images/icons/favicon.png" />
<link rel="icon" sizes="192x192" type="image/png" href="https://www.highpoint.edu/wp-content/themes/hpu/assets/frontend/images/icons/favicon_192x192.png" />
<link rel="icon" sizes="48x48" type="image/png" href="https://www.highpoint.edu/wp-content/themes/hpu/assets/frontend/images/icons/favicon_48x48.png" />
<link rel="icon" sizes="32x32" type="image/png" href="https://www.highpoint.edu/wp-content/themes/hpu/assets/frontend/images/icons/favicon_32x32.png" />
<link rel="apple-touch-icon" sizes="180x180" type="image/png" href="https://www.highpoint.edu/wp-content/themes/hpu/assets/frontend/images/icons/favicon_180x180.png" />
<meta name="msapplication-TileImage" content="https://www.highpoint.edu/wp-content/themes/hpu/assets/frontend/images/icons/favicon_270x270.png" /><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HPU Theme Build · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --hpu: #330072;
  --hpu-lav: #ede6ff;
  --hpu-lavx: #f8f6ff;
  --org: #c25a0a;
  --org-bg: #fef3ea;
  --wh: #ffffff;
  --surf: #f5f5f5;
  --done: #16a34a;
  --done-bg: #dcfce7;
  --t1: #0d0d0d;
  --t2: #4b5563;
  --t3: #9ca3af;
  --f: 'Poppins', sans-serif;
  --rlg: 16px;
  --rmd: 10px;
  --rsm: 6px;
  --sh: 0 1px 4px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.04);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--surf); min-height: 100vh; }
body { font-family: var(--f); color: var(--t1); -webkit-font-smoothing: antialiased; padding-bottom: 52px; }
#app { max-width: 1300px; margin: 0 auto; }

.hdr {
  background: var(--wh);
  padding: 20px 28px 16px;
  position: sticky; top: 0; z-index: 10;
  box-shadow: 0 1px 0 rgba(0,0,0,0.07);
}
.hdr-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
.hdr-title { font-size: 19px; font-weight: 600; color: var(--hpu); letter-spacing: -0.4px; line-height: 1.1; }
.hdr-sub { font-size: 11px; font-weight: 400; color: var(--t3); margin-top: 3px; }
.hdr-right { text-align: right; }
.hdr-date { font-size: 12px; font-weight: 400; color: var(--t3); }
.hdr-tag { font-size: 10px; font-weight: 400; color: #d1d5db; margin-top: 1px; }
.hdr-prog { display: flex; align-items: center; gap: 10px; }
.hdr-prog-lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.7px; color: var(--t3); min-width: 52px; }
.bar-track { flex: 1; height: 5px; background: var(--hpu-lav); border-radius: 100px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--hpu); border-radius: 100px; transition: width 1s cubic-bezier(.4,0,.2,1); }
.hdr-pct { font-size: 13px; font-weight: 600; color: var(--hpu); min-width: 40px; text-align: right; }

.body { padding: 18px 28px 0; display: flex; flex-direction: column; gap: 16px; }
.sec-lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.9px; color: var(--t3); margin-bottom: 8px; }
.g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.g5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.wg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: stretch; }
.card { background: var(--wh); border-radius: var(--rlg); box-shadow: var(--sh); overflow: hidden; }

.mc { padding: 16px 18px; }
.mc-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.mc-big { font-size: 28px; font-weight: 600; color: var(--t1); line-height: 1; letter-spacing: -0.8px; }
.mc-of { font-size: 12px; font-weight: 400; color: var(--t3); margin-top: 3px; }
.mc-icon { width: 30px; height: 30px; border-radius: var(--rsm); display: flex; align-items: center; justify-content: center; font-size: 14px; }
.mc-icon.p { background: var(--hpu-lav); color: var(--hpu); }
.mc-icon.o { background: var(--org-bg); color: var(--org); }
.mc-lbl { font-size: 11px; font-weight: 500; color: var(--t2); margin-bottom: 10px; }
.mc-bar { display: flex; align-items: center; gap: 8px; }
.mb-track { flex: 1; height: 3px; background: var(--hpu-lav); border-radius: 100px; overflow: hidden; }
.mb-track.o { background: #fde8d4; }
.mb-fill { height: 100%; background: var(--hpu); border-radius: 100px; }
.mb-fill.o { background: var(--org); }
.mc-pct { font-size: 11px; font-weight: 600; color: var(--hpu); min-width: 28px; text-align: right; }
.mc-pct.o { color: var(--org); }

.pc { padding: 16px 18px; display: flex; align-items: center; gap: 14px; }
.pc-chart { position: relative; width: 66px; height: 66px; flex-shrink: 0; }
.pc-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.pc-pct { font-size: 13px; font-weight: 600; color: var(--hpu); }
.pc-pct.o { color: var(--org); }
.pc-info { flex: 1; min-width: 0; }
.pc-name { font-size: 15px; font-weight: 600; color: var(--t1); letter-spacing: -0.2px; }
.pc-role { font-size: 11px; font-weight: 400; color: var(--t3); margin-bottom: 8px; margin-top: 1px; }
.pc-stats { display: flex; gap: 16px; }
.ps-n { font-size: 17px; font-weight: 600; color: var(--hpu); line-height: 1; letter-spacing: -0.3px; }
.ps-n.o { color: var(--org); }
.ps-l { font-size: 10px; font-weight: 400; color: var(--t3); margin-top: 1px; }

.wc-head { padding: 13px 18px; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.wc-title { font-size: 13px; font-weight: 600; color: var(--t1); display: flex; align-items: center; gap: 8px; letter-spacing: -0.1px; }
.wc-title i { color: var(--hpu); font-size: 12px; }
.wc-cnt { font-size: 11px; font-weight: 500; color: var(--t3); background: rgba(0,0,0,0.04); border-radius: 100px; padding: 2px 8px; }
.wc-body { flex: 1; }

.sh { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.7px; color: var(--t3); padding: 9px 18px 6px; background: rgba(0,0,0,0.015); border-top: 1px solid rgba(0,0,0,0.05); }
.sh.first { border-top: none; }

.tdiv { display: flex; align-items: center; gap: 8px; padding: 8px 18px 2px; }
.tdiv-line { flex: 1; height: 1px; background: rgba(194,90,10,.2); }
.tdiv-lbl { font-size: 10px; font-weight: 500; color: var(--org); white-space: nowrap; display: flex; align-items: center; gap: 4px; }

.pi { display: flex; align-items: flex-start; gap: 9px; padding: 9px 18px; transition: background .1s; cursor: default; }
.pi + .pi { border-top: 1px solid rgba(0,0,0,0.04); }
.pi:hover { background: rgba(0,0,0,0.012); }

.p-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
.pi.done        .p-dot { background: var(--done); }
.pi.in-progress .p-dot { background: var(--hpu); box-shadow: 0 0 0 2px rgba(51,0,114,0.15); }
.pi.blocked     .p-dot { background: var(--org); }
.pi.planning    .p-dot { background: #c9cdd5; }
.pi.not-started .p-dot { background: transparent; border: 1.5px solid #d1d5db; }

.pn { font-size: 10px; font-weight: 400; color: #d1d5db; min-width: 14px; flex-shrink: 0; padding-top: 2px; }
.pb { flex: 1; min-width: 0; }
.pname { font-size: 12px; font-weight: 500; color: var(--t1); line-height: 1.35; }
.pmeta { margin-top: 2px; display: flex; flex-direction: column; gap: 1px; }
.pnote { font-size: 11px; font-weight: 400; color: var(--t3); }
.pdep { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 500; color: var(--org); }
.punb { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 500; color: #15803d; }

.sbadge { font-size: 10px; font-weight: 500; white-space: nowrap; flex-shrink: 0; padding-top: 2px; }
.pi.done        .sbadge { color: #15803d; }
.pi.in-progress .sbadge { color: var(--hpu); }
.pi.blocked     .sbadge { color: var(--org); }
.pi.planning    .sbadge { color: #9ca3af; }
.pi.not-started .sbadge { color: #d1d5db; }

.qtc { background: var(--wh); border-radius: var(--rmd); box-shadow: var(--sh); padding: 13px; }
.qt-ico { width: 26px; height: 26px; border-radius: var(--rsm); background: var(--hpu-lav); color: var(--hpu); display: flex; align-items: center; justify-content: center; font-size: 11px; margin-bottom: 8px; }
.qt-name { font-size: 11px; font-weight: 500; color: var(--t1); line-height: 1.4; margin-bottom: 6px; }
.qt-st { font-size: 10px; font-weight: 500; color: var(--t3); }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
</style>
</head>
