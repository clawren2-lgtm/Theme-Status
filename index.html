<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" sizes="512x512" type="image/png" href="/wp-content/themes/hpu/assets/frontend/images/icons/favicon.png" /><link rel="icon" sizes="192x192" type="image/png" href="/wp-content/themes/hpu/assets/frontend/images/icons/favicon_192x192.png" /><link rel="icon" sizes="48x48" type="image/png" href="/wp-content/themes/hpu/assets/frontend/images/icons/favicon_48x48.png" /><link rel="icon" sizes="32x32" type="image/png" href="/wp-content/themes/hpu/assets/frontend/images/icons/favicon_32x32.png" /><link rel="apple-touch-icon" sizes="180x180" type="image/png" href="/wp-content/themes/hpu/assets/frontend/images/icons/favicon_180x180.png" /><meta name="msapplication-TileImage" content="/wp-content/themes/hpu/assets/frontend/images/icons/favicon_270x270.png" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HPU Theme Build · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --hpu: #330072;
  --hpu-lav: #ede6ff;
  --hpu-lavx: #f8f6ff;
  --org: #c25a0a;
  --org-bg: #fef3ea;
  --wh: #ffffff;
  --surf: #f5f5f5;
  --done: #16a34a;
  --done-bg: #dcfce7;
  --t1: #0d0d0d;
  --t2: #4b5563;
  --t3: #9ca3af;
  --f: 'Poppins', sans-serif;
  --rlg: 16px;
  --rmd: 10px;
  --rsm: 6px;
  --sh: 0 1px 4px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.04);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--surf); min-height: 100vh; }
body { font-family: var(--f); color: var(--t1); -webkit-font-smoothing: antialiased; padding-bottom: 52px; }
#app { max-width: 1300px; margin: 0 auto; }

.hdr {
  background: var(--wh);
  padding: 20px 28px 16px;
  position: sticky; top: 0; z-index: 10;
  box-shadow: 0 1px 0 rgba(0,0,0,0.07);
}
.hdr-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
.hdr-left {}
.hdr-title { font-size: 19px; font-weight: 600; color: var(--hpu); letter-spacing: -0.4px; line-height: 1.1; }
.hdr-sub { font-size: 11px; font-weight: 400; color: var(--t3); margin-top: 3px; }
.hdr-right { text-align: right; }
.hdr-date { font-size: 12px; font-weight: 400; color: var(--t3); }
.hdr-tag { font-size: 10px; font-weight: 400; color: #d1d5db; margin-top: 1px; }
.hdr-prog { display: flex; align-items: center; gap: 10px; }
.hdr-prog-lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.7px; color: var(--t3); min-width: 52px; }
.bar-track { flex: 1; height: 5px; background: var(--hpu-lav); border-radius: 100px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--hpu); border-radius: 100px; transition: width 1s cubic-bezier(.4,0,.2,1); }
.hdr-pct { font-size: 13px; font-weight: 600; color: var(--hpu); min-width: 40px; text-align: right; }

.body { padding: 18px 28px 0; display: flex; flex-direction: column; gap: 16px; }
.sec-lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.9px; color: var(--t3); margin-bottom: 8px; }
.g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.g5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.wg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: stretch; }
.card { background: var(--wh); border-radius: var(--rlg); box-shadow: var(--sh); overflow: hidden; }

.mc { padding: 16px 18px; }
.mc-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.mc-big { font-size: 28px; font-weight: 600; color: var(--t1); line-height: 1; letter-spacing: -0.8px; }
.mc-of { font-size: 12px; font-weight: 400; color: var(--t3); margin-top: 3px; }
.mc-icon { width: 30px; height: 30px; border-radius: var(--rsm); display: flex; align-items: center; justify-content: center; font-size: 12px; }
.mc-icon.p { background: var(--hpu-lav); color: var(--hpu); }
.mc-icon.o { background: var(--org-bg); color: var(--org); }
.mc-lbl { font-size: 11px; font-weight: 500; color: var(--t2); margin-bottom: 10px; }
.mc-bar { display: flex; align-items: center; gap: 8px; }
.mb-track { flex: 1; height: 3px; background: var(--hpu-lav); border-radius: 100px; overflow: hidden; }
.mb-track.o { background: #fde8d4; }
.mb-fill { height: 100%; background: var(--hpu); border-radius: 100px; }
.mb-fill.o { background: var(--org); }
.mc-pct { font-size: 11px; font-weight: 600; color: var(--hpu); min-width: 28px; text-align: right; }
.mc-pct.o { color: var(--org); }

.pc { padding: 16px 18px; display: flex; align-items: center; gap: 14px; }
.pc-chart { position: relative; width: 66px; height: 66px; flex-shrink: 0; }
.pc-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.pc-pct { font-size: 13px; font-weight: 600; color: var(--hpu); }
.pc-pct.o { color: var(--org); }
.pc-info { flex: 1; min-width: 0; }
.pc-name { font-size: 15px; font-weight: 600; color: var(--t1); letter-spacing: -0.2px; }
.pc-role { font-size: 11px; font-weight: 400; color: var(--t3); margin-bottom: 8px; margin-top: 1px; }
.pc-stats { display: flex; gap: 16px; }
.ps-n { font-size: 17px; font-weight: 600; color: var(--hpu); line-height: 1; letter-spacing: -0.3px; }
.ps-n.o { color: var(--org); }
.ps-l { font-size: 10px; font-weight: 400; color: var(--t3); margin-top: 1px; }

.wg .card { display: flex; flex-direction: column; }
.wc-head { padding: 13px 18px; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.wc-title { font-size: 13px; font-weight: 600; color: var(--t1); display: flex; align-items: center; gap: 8px; letter-spacing: -0.1px; }
.wc-title i { color: var(--hpu); font-size: 12px; }
.wc-cnt { font-size: 11px; font-weight: 500; color: var(--t3); background: rgba(0,0,0,0.04); border-radius: 100px; padding: 2px 8px; }
.wc-body { flex: 1; }

.sh { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.7px; color: var(--t3); padding: 9px 18px 6px; background: rgba(0,0,0,0.015); border-top: 1px solid rgba(0,0,0,0.05); }
.sh.first { border-top: none; }

.tdiv { display: flex; align-items: center; gap: 8px; padding: 8px 18px 2px; }
.tdiv-line { flex: 1; height: 1px; background: rgba(194,90,10,.2); }
.tdiv-lbl { font-size: 10px; font-weight: 500; color: var(--org); white-space: nowrap; }

.pi { display: flex; align-items: flex-start; gap: 9px; padding: 9px 18px; transition: background .1s; cursor: default; }
.pi + .pi { border-top: 1px solid rgba(0,0,0,0.04); }
.pi:hover { background: rgba(0,0,0,0.012); }

.p-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
.pi.done        .p-dot { background: var(--done); }
.pi.in-progress .p-dot { background: var(--hpu); box-shadow: 0 0 0 2px rgba(51,0,114,0.15); }
.pi.blocked     .p-dot { background: var(--org); }
.pi.planning    .p-dot { background: #c9cdd5; }
.pi.not-started .p-dot { background: transparent; border: 1.5px solid #d1d5db; }

.pn { font-size: 10px; font-weight: 400; color: #d1d5db; min-width: 14px; flex-shrink: 0; padding-top: 2px; }
.pb { flex: 1; min-width: 0; }
.pname { font-size: 12px; font-weight: 500; color: var(--t1); line-height: 1.35; }
.pmeta { margin-top: 2px; display: flex; flex-direction: column; gap: 1px; }
.pnote { font-size: 11px; font-weight: 400; color: var(--t3); }
.pdep { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 500; color: var(--org); }
.punb { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 500; color: #15803d; }

.sbadge { font-size: 10px; font-weight: 500; white-space: nowrap; flex-shrink: 0; padding-top: 2px; }
.pi.done        .sbadge { color: #15803d; }
.pi.in-progress .sbadge { color: var(--hpu); }
.pi.blocked     .sbadge { color: var(--org); }
.pi.planning    .sbadge { color: #9ca3af; }
.pi.not-started .sbadge { color: #d1d5db; }

.qtc { background: var(--wh); border-radius: var(--rmd); box-shadow: var(--sh); padding: 13px; }
.qt-ico { width: 26px; height: 26px; border-radius: var(--rsm); background: var(--hpu-lav); color: var(--hpu); display: flex; align-items: center; justify-content: center; font-size: 11px; margin-bottom: 8px; }
.qt-name { font-size: 11px; font-weight: 500; color: var(--t1); line-height: 1.4; margin-bottom: 6px; }
.qt-st { font-size: 10px; font-weight: 500; color: var(--t3); }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

svg {
  display: inline-block;
  vertical-align: middle;
  color: currentColor;
}

.icon-sm {
  width: 14px;
  height: 14px;
}

.mc-icon svg {
  width: 16px;
  height: 16px;
}

.wc-title svg {
  width: 13px;
  height: 13px;
  margin-right: 3px;
}

.qt-ico svg {
  width: 13px;
  height: 13px;
}

.pdep svg,
.punb svg,
.tdiv-lbl svg {
  width: 10px;
  height: 10px;
}
</style>
</head>
<body>
<h2 class="sr-only">HPU Theme Build Project Dashboard</h2>
<div id="app"></div>
<script>
// ============================================================
// UPDATE THESE TO CHANGE STATUS
// ============================================================

const S = { D:'done', IP:'in-progress', BL:'blocked', PL:'planning', NS:'not-started' };

const BLOCKS = [
  { name:'KPI',            status:S.IP, note:'In flight today',                unblocks:['KPI Pattern','KPIs Pattern'] },
  { name:'KPI Group',      status:S.NS, note:null,                              unblocks:['KPIs Pattern'] },
  { name:'Faculty Staff',  status:S.NS, note:'Clean rebuild required',          unblocks:['Welcome Message','Related Faculty Staff'] },
  { name:'Icons',          status:S.NS, note:null,                              unblocks:['How to Apply Steps'] },
  { name:'Tabbed Content', status:S.NS, note:null,                              unblocks:[] },
  { name:'Tab Item',       status:S.NS, note:'Build with Tabbed Content',       unblocks:[] },
  { name:'Pagination',     status:S.NS, note:'Sean has prior work',             unblocks:['Query Templates'] },
  { name:'Days Until',     status:S.NS, note:'Confirm vs Countdown pattern',    unblocks:[] },
  { name:'Anchors Menu',   status:S.NS, note:null,                              unblocks:[] },
  { name:'Modal Video',    status:S.NS, note:'Confirm link to video patterns',  unblocks:[] },
];
const BLOCKS_DONE = 21;

const PATTERNS = [
  { name:'Requirements',           status:S.IP, blockedBy:null,                        tier:1 },
  { name:'Full Width Video',       status:S.PL, blockedBy:null,                        tier:1 },
  { name:'Media Gallery',          status:S.IP, blockedBy:null,                        tier:1 },
  { name:'Major Minor Landing',    status:S.PL, blockedBy:null,                        tier:1 },
  { name:'Quotes',                 status:S.PL, blockedBy:null,                        tier:1 },
  { name:'Internships + Careers',  status:S.PL, blockedBy:null,                        tier:1 },
  { name:'KPI',                    status:S.BL, blockedBy:'KPI Block',                 tier:2 },
  { name:'KPIs',                   status:S.BL, blockedBy:'KPI + KPI Group',           tier:2 },
  { name:'Welcome Message',        status:S.BL, blockedBy:'Faculty Staff Block',        tier:2 },
  { name:'Related Faculty Staff',  status:S.BL, blockedBy:'Faculty Staff Block',        tier:2 },
  { name:'Keep Browsing',          status:S.BL, blockedBy:'Pattern-Inserter + Links',   tier:2 },
  { name:'Services + Resources',   status:S.BL, blockedBy:'Pattern-Inserter + Links',   tier:2 },
  { name:'How to Apply Steps',     status:S.BL, blockedBy:'Icons + Pattern-Inserter',   tier:2 },
];
const PATTERNS_DONE = 15;

const PLUGINS = [
  { name:'Degrees + Programs Search', status:S.NS },
  { name:'Department Listing',        status:S.NS },
  { name:'Facilities List',           status:S.NS },
  { name:'Faculty Staff Listing',     status:S.NS },
  { name:'Schools + Colleges',        status:S.NS },
];

const FOUNDATION = [
  { name:'Global Styles + Design Principles', status:S.NS, note:'Gates 15 done patterns from shipping' },
  { name:'Role Management System',            status:S.NS, note:'Required before block restrictions' },
  { name:'Lockdown Process',                  status:S.NS, note:null },
  { name:'Style Restrictions',               status:S.NS, note:null },
  { name:'Block Restriction by Role',         status:S.NS, note:'Needs role system first' },
  { name:'JS Cleanup',                        status:S.NS, note:null },
  { name:'Plugin Cleanup',                    status:S.NS, note:null },
];

const QUERY_TEMPLATES = [
  { name:'News Listing T4 Filter', status:S.NS },
  { name:'News Listing T6 Filter', status:S.NS },
  { name:'Related Articles',       status:S.NS },
  { name:'Related Content',        status:S.NS },
  { name:'Related News',           status:S.NS },
];

// ============================================================
// RENDER ENGINE
// ============================================================

const SC = {
  'done':        { lbl:'Done' },
  'in-progress': { lbl:'In Progress' },
  'blocked':     { lbl:'Blocked' },
  'planning':    { lbl:'Planning' },
  'not-started': { lbl:'' },
};

function pct(d, t) { return t === 0 ? 0 : Math.round((d / t) * 100); }
function cntDone(arr) { return arr.filter(x => x.status === S.D).length; }

function renderItem(item, idx, showUnblocks) {
  const meta = [];
  if (item.note) meta.push(`<div class="pnote">${item.note}</div>`);
  if (item.blockedBy) meta.push(`<div class="pdep"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="2"/></svg>Blocked by ${item.blockedBy}</div>`);
  if (showUnblocks && item.unblocks && item.unblocks.length) {
    meta.push(`<div class="punb"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="2"/></svg>Unblocks ${item.unblocks.join(', ')}</div>`);
  }
  const lbl = SC[item.status]?.lbl || '';
  return `<div class="pi ${item.status}" role="listitem">
    <div class="p-dot"></div>
    <span class="pn">${idx}</span>
    <div class="pb">
      <div class="pname">${item.name}</div>
      ${meta.length ? `<div class="pmeta">${meta.join('')}</div>` : ''}
    </div>
    ${lbl ? `<span class="sbadge">${lbl}</span>` : ''}
  </div>`;
}

function render() {
  const bTot  = BLOCKS_DONE + BLOCKS.length,    bDone  = BLOCKS_DONE + cntDone(BLOCKS);
  const pTot  = PATTERNS_DONE + PATTERNS.length, pDone  = PATTERNS_DONE + cntDone(PATTERNS);
  const plDone = cntDone(PLUGINS),  plTot = PLUGINS.length;
  const qtDone = cntDone(QUERY_TEMPLATES), qtTot = QUERY_TEMPLATES.length;
  const fDone  = cntDone(FOUNDATION), fTot = FOUNDATION.length;
  const allTot  = bTot + pTot + plTot + qtTot + fTot;
  const allDone = bDone + pDone + plDone + qtDone + fDone;
  const allPct  = pct(allDone, allTot);

  const cTot = plTot + fTot, cDone = plDone + fDone;

  const today = new Date().toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });

  const pat1 = PATTERNS.filter(p => p.tier === 1);
  const pat2 = PATTERNS.filter(p => p.tier === 2);

  const patHtml = [
    ...pat1.map((p, i) => renderItem(p, i + 1, false)),
    `<div class="tdiv" role="separator">
      <div class="tdiv-line"></div>
      <span class="tdiv-lbl"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="2"/></svg>Tier 2 - Blocked</span>
      <div class="tdiv-line"></div>
    </div>`,
    ...pat2.map((p, i) => renderItem(p, pat1.length + i + 1, false)),
  ].join('');

  document.getElementById('app').innerHTML = `
    <div class="hdr" role="banner">
      <div class="hdr-top">
        <div class="hdr-left">
          <div class="hdr-title">HPU Theme Build</div>
          <div class="hdr-sub">hpu24 Block Theme &middot; ACF to Gutenberg</div>
        </div>
        <div class="hdr-right">
          <div class="hdr-date">${today}</div>
          <div class="hdr-tag">Project Dashboard</div>
        </div>
      </div>
      <div class="hdr-prog">
        <span class="hdr-prog-lbl">Overall</span>
        <div class="bar-track" role="progressbar" aria-valuenow="${allPct}" aria-valuemin="0" aria-valuemax="100" aria-label="Overall project ${allPct}% complete">
          <div class="bar-fill" style="width:${allPct}%"></div>
        </div>
        <span class="hdr-pct">${allPct}% &middot; ${allDone} of ${allTot}</span>
      </div>
    </div>

    <div class="body">

      <div role="region" aria-label="Progress by track">
        <div class="sec-lbl">Progress by Track</div>
        <div class="g4">

          <div class="card mc">
            <div class="mc-top">
              <div><div class="mc-big">${bDone}</div><div class="mc-of">of ${bTot} blocks</div></div>
              <div class="mc-icon p"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 18 2 12 8 6"/></svg></div>
            </div>
            <div class="mc-lbl">Custom Blocks</div>
            <div class="mc-bar">
              <div class="mb-track"><div class="mb-fill" style="width:${pct(bDone,bTot)}%"></div></div>
              <span class="mc-pct">${pct(bDone,bTot)}%</span>
            </div>
          </div>

          <div class="card mc">
            <div class="mc-top">
              <div><div class="mc-big">${pDone}</div><div class="mc-of">of ${pTot} patterns</div></div>
              <div class="mc-icon p"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></div>
            </div>
            <div class="mc-lbl">Block Patterns</div>
            <div class="mc-bar">
              <div class="mb-track"><div class="mb-fill" style="width:${pct(pDone,pTot)}%"></div></div>
              <span class="mc-pct">${pct(pDone,pTot)}%</span>
            </div>
          </div>

          <div class="card mc">
            <div class="mc-top">
              <div><div class="mc-big">${plDone}</div><div class="mc-of">of ${plTot} plugins</div></div>
              <div class="mc-icon o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="3"/><path d="M12 2v6"/><path d="M12 16v6"/><path d="M4.22 4.22l4.24 4.24"/><path d="M15.54 15.54l4.24 4.24"/><path d="M2 12h6"/><path d="M16 12h6"/><path d="M4.22 21.78l4.24-4.24"/><path d="M15.54 8.46l4.24-4.24"/></svg></div>
            </div>
            <div class="mc-lbl">Plugins</div>
            <div class="mc-bar">
              <div class="mb-track o"><div class="mb-fill o" style="width:${pct(plDone,plTot)}%"></div></div>
              <span class="mc-pct o">${pct(plDone,plTot)}%</span>
            </div>
          </div>

          <div class="card mc">
            <div class="mc-top">
              <div><div class="mc-big">${qtDone}</div><div class="mc-of">of ${qtTot} templates</div></div>
              <div class="mc-icon o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></div>
            </div>
            <div class="mc-lbl">Query Templates</div>
            <div class="mc-bar">
              <div class="mb-track o"><div class="mb-fill o" style="width:${pct(qtDone,qtTot)}%"></div></div>
              <span class="mc-pct o">${pct(qtDone,qtTot)}%</span>
            </div>
          </div>

        </div>
      </div>

      <div role="region" aria-label="Team">
        <div class="sec-lbl">Team</div>
        <div class="g3">
          <div class="card pc">
            <div class="pc-chart">
              <canvas id="ci" width="66" height="66" role="img" aria-label="Ian ${pct(bDone,bTot)}% complete">${bDone} of ${bTot} done.</canvas>
              <div class="pc-overlay"><span class="pc-pct">${pct(bDone,bTot)}%</span></div>
            </div>
            <div class="pc-info">
              <div class="pc-name">Ian</div>
              <div class="pc-role">Custom React Blocks</div>
              <div class="pc-stats">
                <div><div class="ps-n">${bTot - bDone}</div><div class="ps-l">Remaining</div></div>
                <div><div class="ps-n">${bDone}</div><div class="ps-l">Completed</div></div>
              </div>
            </div>
          </div>
          <div class="card pc">
            <div class="pc-chart">
              <canvas id="cj" width="66" height="66" role="img" aria-label="Jasani ${pct(pDone,pTot)}% complete">${pDone} of ${pTot} done.</canvas>
              <div class="pc-overlay"><span class="pc-pct">${pct(pDone,pTot)}%</span></div>
            </div>
            <div class="pc-info">
              <div class="pc-name">Jasani</div>
              <div class="pc-role">Block Patterns</div>
              <div class="pc-stats">
                <div><div class="ps-n">${pTot - pDone}</div><div class="ps-l">Remaining</div></div>
                <div><div class="ps-n">${pDone}</div><div class="ps-l">Completed</div></div>
              </div>
            </div>
          </div>
          <div class="card pc">
            <div class="pc-chart">
              <canvas id="cc" width="66" height="66" role="img" aria-label="Corey ${pct(cDone,cTot)}% complete">${cDone} of ${cTot} done.</canvas>
              <div class="pc-overlay"><span class="pc-pct o">${pct(cDone,cTot)}%</span></div>
            </div>
            <div class="pc-info">
              <div class="pc-name">Corey</div>
              <div class="pc-role">Plugins + Foundation</div>
              <div class="pc-stats">
                <div><div class="ps-n o">${cTot - cDone}</div><div class="ps-l">Remaining</div></div>
                <div><div class="ps-n o">${cDone}</div><div class="ps-l">Completed</div></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div role="region" aria-label="Work queues">
        <div class="sec-lbl">Work Queues &middot; Priority Order</div>
        <div class="wg">

          <div class="card" role="region" aria-label="Ian's block queue">
            <div class="wc-head">
              <div class="wc-title"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 18 2 12 8 6"/></svg>Ian</div>
              <span class="wc-cnt">${BLOCKS.length} remaining</span>
            </div>
            <div class="wc-body" role="list">
              ${BLOCKS.map((b, i) => renderItem(b, i + 1, true)).join('')}
            </div>
          </div>

          <div class="card" role="region" aria-label="Jasani's pattern queue">
            <div class="wc-head">
              <div class="wc-title"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Jasani</div>
              <span class="wc-cnt">${PATTERNS.length} remaining</span>
            </div>
            <div class="wc-body" role="list">${patHtml}</div>
          </div>

          <div class="card" role="region" aria-label="Corey's queue">
            <div class="wc-head">
              <div class="wc-title"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="3"/><path d="M12 2v6"/><path d="M12 16v6"/><path d="M4.22 4.22l4.24 4.24"/><path d="M15.54 15.54l4.24 4.24"/><path d="M2 12h6"/><path d="M16 12h6"/><path d="M4.22 21.78l4.24-4.24"/><path d="M15.54 8.46l4.24-4.24"/></svg>Corey</div>
              <span class="wc-cnt">${PLUGINS.length + FOUNDATION.length} items</span>
            </div>
            <div class="wc-body">
              <div class="sh first" role="heading" aria-level="3">Plugins</div>
              <div role="list">${PLUGINS.map((p, i) => renderItem(p, i + 1, false)).join('')}</div>
              <div class="sh" role="heading" aria-level="3">Foundation + Governance</div>
              <div role="list">${FOUNDATION.map((f, i) => renderItem({...f, blockedBy:null}, i + 1, false)).join('')}</div>
            </div>
          </div>

        </div>
      </div>

      <div role="region" aria-label="Query templates">
        <div class="sec-lbl">Query Templates &middot; ${QUERY_TEMPLATES.length} remaining</div>
        <div class="g5">
          ${QUERY_TEMPLATES.map(q => `
            <div class="qtc">
              <div class="qt-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></div>
              <div class="qt-name">${q.name}</div>
              <div class="qt-st">${SC[q.status]?.lbl || 'Not started'}</div>
            </div>`).join('')}
        </div>
      </div>

    </div>
  `;

  function mkChart(id, done, tot, isOrg) {
    const el = document.getElementById(id);
    if (!el) return;
    const remaining = Math.max(0, tot - done);
    new Chart(el, {
      type: 'doughnut',
      data: {
        datasets: [{
          data: done === 0 ? [0.001, 1] : [done, remaining],
          backgroundColor: isOrg ? ['#c25a0a','#fef3ea'] : ['#330072','#ede6ff'],
          borderWidth: 0,
          borderRadius: done === 0 ? 0 : 2,
        }]
      },
      options: {
        cutout: '76%',
        responsive: false,
        plugins: { legend:{ display:false }, tooltip:{ enabled:false } },
        animation: { duration:900, easing:'easeInOutQuart' },
      }
    });
  }

  mkChart('ci', bDone, bTot, false);
  mkChart('cj', pDone, pTot, false);
  mkChart('cc', cDone, cTot, true);
}

render();
</script>
</body>
</html>
